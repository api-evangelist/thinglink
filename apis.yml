aid: thinglink
name: Thinglink
description: >-
  Thinglink is an educational technology company offering a no-code, AI-powered
  platform for creating and deploying immersive, interactive learning
  experiences. Users enrich images, videos, and 360deg / virtual-tour media with
  clickable "tags" that surface text, audio, links, and embedded content,
  producing multimodal content for XR, AR, and 360deg training that runs on any
  device. Thinglink serves K-12 and higher education as well as corporate
  learning and safety-training teams, and integrates with learning-management
  systems. It was surfaced as a 500 Global portfolio company and added to the
  API Evangelist network. Thinglink publishes a public trust center
  (ISO 27001, GDPR) but exposes no public developer API surface at this time.
